.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.mu{color:var(--mu);font-size:13px}
.stat{text-align:center;padding:10px;border-radius:10px;background:var(--bg)}.stat b{display:block;font-size:24px}
.ok{color:var(--ok)}.no{color:var(--no)}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700}

.grid .a{background:var(--bl);color:#fff}.grid .d{background:var(--y);color:#111}.grid .cur{outline:3px solid #93c5fd}
.tm{font:700 20px monospace;color:var(--y)}.trik{background:rgba(250,204,21,.18);border-left:4px solid var(--y);padding:8px 12px;border-radius:6px;margin-top:8px}

const FULL={TWK:150,TIU:175,TKP:225},PG={TWK:65,TIU:80,TKP:156}; // sesuaikan passing grade dengan aturan terbaru
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(x){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};

let U=L('u')||{},cur=L('ses'),V='dash',ex=null,R=null,tmr=null,admOK=false;
const B=[
{c:'TKP',t:'Anda melayani warga yang emosi karena layanan instansi lambat. Sikap Anda ....',o:['Meminta satpam mengeluarkan warga tersebut','Tenang, mendengar dengan empati, lalu memberi solusi prosedural yang cepat dan ramah','Menegur agar berbicara sopan terlebih dahulu','Membiarkan menunggu sampai emosinya mereda','Mengalihkan ke rekan karena merasa tertekan'],w:[1,5,3,2,4],p:'Skor 5: empati + solusi nyata. Menyalahkan/menghindar bernilai rendah.',tr:'Jawaban bobot 5 biasanya: tenang, solutif, tuntas, sesuai prosedur.'},
{c:'TKP',t:'Rekan satu tim belum menyelesaikan bagiannya padahal tenggat dekat. Anda ....',o:['Langsung melapor ke atasan tanpa bicara','Menanyakan kendalanya dan menawarkan bantuan sambil menyusun rencana bersama','Mengerjakan bagian itu sendiri diam-diam','Membiarkan karena itu tanggung jawabnya','Menegurnya keras di depan tim'],w:[2,5,4,1,1],p:'Kolaboratif dan komunikatif mengungguli melapor langsung atau menegur.',tr:'Hindari opsi yang mempermalukan atau pasif.'},
{c:'TKP',t:'Atasan memberi tugas di luar bidang keahlian Anda. Anda ....',o:['Menolak karena bukan bidang saya','Menerima, mempelajarinya, dan meminta arahan bila perlu','Menerima tetapi dikerjakan seadanya','Meminta rekan mengerjakannya','Menunda sampai ditegur'],w:[1,5,3,2,1],p:'Sikap adaptif dan mau belajar bernilai tertinggi.',tr:'Kata kunci 5: belajar, tanggung jawab, inisiatif.'},
{c:'TKP',t:'Instansi menerapkan aplikasi baru yang belum Anda kuasai. Anda ....',o:['Tetap memakai cara lama','Mengikuti pelatihan dan berlatih mandiri agar cepat menguasai','Menunggu rekan membantu terus','Mengeluh ke atasan','Menyerahkan pekerjaan ke rekan lain'],w:[1,5,3,2,1],p:'Orientasi pada pembelajaran dan adaptasi teknologi.',tr:'Pilih yang proaktif dan mandiri.'}];
const M0=[{t:'TWK: Pilar Negara & Sejarah',i:'Pancasila, UUD 1945, NKRI, Bhinneka Tunggal Ika, sejarah pergerakan nasional, sistem pemerintahan, bela negara, nasionalisme, integritas.',k:'Hafal pasal kunci (Pasal 1, 27, 28, 30, 31) dan tahun-tahun besar; soal studi kasus: pilih sikap konstruktif dan sesuai hukum.'},
{t:'TIU: Numerik, Verbal, Figural',i:'Deret angka, aritmetika, perbandingan, persen, tabel & logika, silogisme, analogi, serta pola gambar.',k:'Hitung kompensasi (kuadratkan mendekati bilangan bulat), cek selisih lalu rasio, dan eliminasi opsi yang menyalahi satuan atau besaran.'},
{t:'TKP: Karakteristik Pribadi',i:'Pelayanan publik, jejaring kerja, sosial budaya, teknologi informasi & komunikasi, profesionalisme, anti-radikalisme.',k:'Tidak ada jawaban salah, hanya bobot 1-5. Pilih yang solutif, kolaboratif, sesuai prosedur, dan tidak menghindar.'}];
const TM=['Implementasi Pancasila','Implementasi UUD 1945','Nasionalisme','Pilar NKRI','Integritas','Bela Negara','Gagasan Utama','Kalimat Efektif'];
const w=(i,t,o,k,p,tr)=>({c:'TWK',tm:TM[i],t,o,k,p,tr});
const T=[
w(0,'Rekan kerja Anda yang beragama minoritas meminta izin singkat untuk beribadah pada jam kerja. Sikap Anda sebagai sesama ASN adalah ....',['Menolak karena mengganggu jam kerja','Mengizinkan dan membantu mengatur pekerjaan agar layanan tetap berjalan','Mengizinkan dengan syarat yang memberatkan','Menyarankan beribadah di rumah saja','Melaporkannya ke atasan sebagai pelanggaran'],1,'Sila ke-1 menuntut penghormatan kebebasan beribadah. Solusi yang menjaga ibadah sekaligus layanan adalah yang paling tepat.','Soal toleransi beragama: pilih sikap menghormati dan memberi solusi.'),
w(0,'Seorang warga kurang mampu dilayani ketus oleh petugas loket karena penampilannya. Sikap petugas yang sesuai sila ke-2 adalah ....',['Melayani warga yang berpenampilan rapi lebih dulu','Mempercepat warga yang dikenal','Memberi layanan cepat hanya bila ada imbalan','Melayani semua warga secara santun dan setara tanpa membedakan','Meminta warga datang di lain waktu'],3,'Sila ke-2: kemanusiaan yang adil dan beradab, yaitu memperlakukan semua orang setara dan bermartabat.','Kata kunci: setara, santun, tanpa diskriminasi.'),
w(0,'Dua kelompok pemuda di lingkungan Anda bersitegang karena perbedaan daerah asal. Tindakan yang mencerminkan sila ke-3 adalah ....',['Mempertemukan keduanya dalam kegiatan gotong royong dan dialog','Membiarkan hingga reda sendiri','Mendukung kelompok yang lebih dulu tinggal','Meminta salah satu kelompok pindah','Menyebarkan kabar perselisihan itu'],0,'Persatuan Indonesia diwujudkan lewat kegiatan bersama yang merekatkan, bukan memihak.','Persatuan = mempertemukan, bukan memihak.'),
w(0,'Bantuan sosial di sebuah desa hanya diberikan kepada kerabat kepala desa. Sikap warga yang sesuai sila ke-5 adalah ....',['Diam agar tidak menimbulkan masalah','Ikut meminta bagian lewat kerabat','Membalas dengan merusak fasilitas desa','Menunggu desa lain bertindak','Melapor ke pihak berwenang dan mendorong pendataan yang transparan'],4,'Sila ke-5 menuntut keadilan sosial; penyimpangan dilaporkan lewat jalur resmi dan perbaikan data.','Pilih jalur resmi, transparan, bukan kekerasan.'),
w(1,'Kalimat Kedaulatan berada di tangan rakyat dan dilaksanakan menurut Undang-Undang Dasar terdapat pada ....',['Pasal 1 ayat (1)','Pasal 1 ayat (3)','Pasal 1 ayat (2)','Pasal 2 ayat (1)','Pasal 3 ayat (1)'],2,'Pasal 1 ayat (2) UUD 1945.','Pasal 1: (1) bentuk negara, (2) kedaulatan, (3) negara hukum.'),
w(1,'Seorang warga menilai sebuah undang-undang merugikan hak konstitusionalnya. Lembaga yang berwenang menguji undang-undang tersebut terhadap UUD 1945 adalah ....',['Mahkamah Agung','Komisi Yudisial','Dewan Perwakilan Daerah','Mahkamah Konstitusi','Badan Pemeriksa Keuangan'],3,'Pasal 24C: Mahkamah Konstitusi berwenang menguji UU terhadap UUD.','MK menguji UU terhadap UUD; MA menguji aturan di bawah UU.'),
w(1,'Sekelompok warga menyampaikan pendapat secara damai di depan kantor pemerintah. Kebebasan tersebut dijamin dalam ....',['Pasal 28E ayat (3) UUD 1945','Pasal 27 ayat (3) UUD 1945','Pasal 30 UUD 1945','Pasal 33 UUD 1945','Pasal 34 UUD 1945'],0,'Pasal 28E ayat (3): kebebasan berserikat, berkumpul, dan mengeluarkan pendapat, dengan batasan Pasal 28J.','Pasal 28 = HAM. Pasal 27(3) = bela negara.'),
w(1,'Hak setiap warga negara memperoleh pendidikan dan kewajiban pemerintah membiayai pendidikan dasar tercantum dalam ....',['Pasal 28','Pasal 29','Pasal 30','Pasal 32','Pasal 31'],4,'Pasal 31 UUD 1945 mengatur pendidikan; Pasal 32 mengatur kebudayaan.','31 pendidikan, 32 kebudayaan, 33 ekonomi, 34 kesejahteraan.'),
w(2,'Kantor Anda perlu membeli perlengkapan. Produk lokal berkualitas setara dengan harga bersaing, sedangkan produk impor lebih bergengsi. Pilihan yang mencerminkan nasionalisme adalah ....',['Produk impor karena bergengsi','Produk lokal karena kualitasnya setara dan mendukung UMKM','Produk impor karena lebih mahal','Menunda pembelian tanpa alasan','Produk yang dijanjikan komisi oleh penjual'],1,'Nasionalisme ekonomi tercermin dari memakai produk dalam negeri yang layak.','Pilih yang mendukung ekonomi dalam negeri tanpa mengorbankan kualitas.'),
w(2,'Sumpah Pemuda 28 Oktober 1928 dihasilkan dalam ....',['Kongres Pemuda III','Kongres Pemuda I','Kongres Pemuda IV','Kongres Pemuda II','Kongres Pemuda V'],3,'Hasilnya dibacakan pada Kongres Pemuda II di Batavia.','Sumpah Pemuda = Kongres Pemuda II.'),
w(2,'Seorang wisatawan asing meminta rekomendasi kuliner dan budaya setempat kepada Anda. Sikap yang mencerminkan nasionalisme adalah ....',['Memperkenalkan budaya dan kuliner lokal dengan bangga dan ramah','Menyarankan wisata luar negeri','Menjawab seadanya tanpa antusias','Merendahkan budaya sendiri agar akrab','Menolak berbicara dengan orang asing'],0,'Bangga dan melestarikan budaya sendiri adalah wujud cinta tanah air.','Pilih sikap bangga, ramah, dan terbuka.'),
w(2,'Nilai utama yang dapat diteladani dari peristiwa 10 November 1945 di Surabaya adalah ....',['Mementingkan diri sendiri','Menghindari konflik dalam kondisi apa pun','Keberanian dan kerelaan berkorban mempertahankan kemerdekaan','Menunggu bantuan pihak asing','Mengutamakan keuntungan pribadi'],2,'Semangat rela berkorban mempertahankan kemerdekaan.','Hari Pahlawan = rela berkorban.'),
w(3,'Di kantor Anda terdapat lelucon yang merendahkan satu suku tertentu. Sikap yang sesuai semangat Bhinneka Tunggal Ika adalah ....',['Ikut tertawa agar suasana cair','Membiarkan karena hanya candaan','Menegur secara santun dan mengingatkan pentingnya saling menghormati','Membalas dengan lelucon tentang suku lain','Melapor ke polisi tanpa menegur'],2,'Perbedaan harus dihormati; teguran santun menjaga persatuan.','Tegas tapi santun, menghargai perbedaan.'),
w(3,'Deklarasi Djuanda 1957 menegaskan bahwa laut di antara dan di dalam kepulauan Indonesia adalah ....',['Perairan bebas internasional','Bagian yang tidak terpisahkan dari wilayah NKRI','Zona ekonomi bersama negara tetangga','Wilayah netral PBB','Perairan yang hanya boleh dilayari kapal asing'],1,'Konsep Wawasan Nusantara menyatukan darat dan laut sebagai satu kesatuan.','Djuanda = laut dan pulau adalah satu kesatuan.'),
w(3,'Urusan pemerintahan absolut yang tidak dapat diserahkan kepada pemerintah daerah adalah ....',['Pengelolaan pasar daerah','Pendidikan dasar','Kebersihan kota','Pertahanan dan politik luar negeri','Pariwisata daerah'],3,'Urusan absolut: politik luar negeri, pertahanan, keamanan, yustisi, moneter dan fiskal nasional, dan agama.','Absolut = urusan negara pusat.'),
w(3,'Beredar ajakan di media sosial agar suatu wilayah memisahkan diri dari NKRI. Sikap warga yang bijak adalah ....',['Menyebarkannya agar orang waspada','Mengabaikan karena hanya isu','Mengajak berdebat dengan emosi','Mendukung agar aspirasi didengar','Memverifikasi, tidak menyebarkan, melaporkan, dan mengedukasi sekitar tentang persatuan'],4,'Menjaga keutuhan NKRI dilakukan lewat literasi, pelaporan, dan edukasi, bukan penyebaran.','Verifikasi, laporkan, edukasi.'),
w(4,'Anda mengetahui rekan memakai kendaraan dinas untuk keperluan pribadi pada akhir pekan. Tindakan awal terbaik adalah ....',['Membiarkannya','Ikut memakai kendaraan itu','Menegur secara pribadi dan mengingatkan aturan; jika berulang melapor ke atasan','Menyebarkannya di grup kantor','Menunggu sampai ketahuan sendiri'],2,'Pendekatan bertahap: ingatkan, lalu lapor jalur resmi bila berulang.','Santun dulu, lalu jalur resmi.'),
w(4,'Anda tidak sengaja salah menginput data anggaran dan belum ada yang mengetahuinya. Sikap berintegritas adalah ....',['Segera melaporkan kesalahan dan memperbaikinya','Diam agar tidak dipermasalahkan','Menyalahkan sistem aplikasi','Menunggu ada yang menemukan','Mengubah catatan agar tampak benar'],0,'Integritas berarti jujur mengakui kesalahan dan bertanggung jawab memperbaikinya.','Jujur, lapor, perbaiki.'),
w(4,'Pemasok memberi bingkisan mahal menjelang pengumuman pemenang tender yang Anda tangani. Tindakan Anda adalah ....',['Menerima karena hanya bingkisan','Menerima lalu membaginya ke rekan','Menerima setelah tender selesai','Menolak dan melaporkan ke unit pengendalian gratifikasi','Menolak tanpa melapor'],3,'Pemberian terkait jabatan berpotensi gratifikasi; tolak dan laporkan.','Tolak + lapor.'),
w(4,'Menaati jam kerja dan aturan kantor secara konsisten, termasuk tanpa pengawasan, mencerminkan nilai antikorupsi ....',['Kesederhanaan','Keberanian','Kepedulian','Keadilan','Kedisiplinan'],4,'Konsisten menaati aturan adalah disiplin.','Disiplin = patuh aturan konsisten.'),
w(5,'Berikut yang BUKAN termasuk nilai dasar bela negara adalah ....',['Cinta tanah air','Sadar berbangsa dan bernegara','Yakin Pancasila sebagai ideologi negara','Rela berkorban untuk bangsa dan negara','Mengutamakan kepentingan kelompok'],4,'Nilai dasar: cinta tanah air, sadar berbangsa dan bernegara, yakin Pancasila, rela berkorban, kemampuan awal bela negara.','Kepentingan kelompok bertentangan dengan bela negara.'),
w(5,'Desa tetangga dilanda banjir. Sebagai ASN yang bertugas di bidang non-kebencanaan, bentuk bela negara yang tepat adalah ....',['Menonton dan menyebarkan foto korban','Menjadi relawan sesuai kemampuan dan berkoordinasi dengan petugas','Menunggu hingga banjir surut','Menyalahkan pemerintah daerah','Mengabaikan karena bukan tugasnya'],1,'Bela negara tercermin dalam kepedulian dan partisipasi terkoordinasi.','Aksi nyata, terkoordinasi, tidak mengeksploitasi korban.'),
w(5,'Kantor Anda menerima surel yang meminta kata sandi akun dengan mengatasnamakan pimpinan. Bentuk bela negara di ruang siber yang tepat adalah ....',['Membuka tautan untuk memastikan','Meneruskannya ke seluruh rekan','Tidak memberikan data, melaporkan ke tim keamanan TI, dan mengedukasi rekan','Membalas dengan kata sandi lama','Menghapus tanpa memberi tahu siapa pun'],2,'Menjaga keamanan data instansi adalah bagian pertahanan siber.','Jangan beri data, laporkan, edukasi.'),
w(5,'Usaha pertahanan dan keamanan negara menurut Pasal 30 ayat (2) UUD 1945 dilaksanakan melalui sistem ....',['Pertahanan militer profesional saja','Keamanan kepolisian saja','Pertahanan berbasis aliansi','Pertahanan dan keamanan rakyat semesta','Pertahanan wilayah perbatasan saja'],3,'Sishankamrata melibatkan seluruh warga, wilayah, dan sumber daya nasional.','Pasal 30 = Sishankamrata.'),
w(6,'Literasi digital kini menjadi kebutuhan dasar masyarakat. Tanpa kemampuan memilah informasi, warga mudah terjebak hoaks yang memicu perpecahan. Karena itu, pemerintah dan komunitas perlu menggalakkan pelatihan literasi digital sejak dini.\nGagasan utama paragraf tersebut adalah ....',['Hoaks menyebabkan perpecahan','Pelatihan literasi digital perlu digalakkan karena menjadi kebutuhan dasar','Pemerintah harus menindak penyebar hoaks','Warga mudah terjebak hoaks','Komunitas berperan dalam pendidikan'],1,'Kalimat terakhir memuat gagasan utama; kalimat lain sebagai alasan.','Cari kalimat yang diawali kata simpulan: karena itu, jadi.'),
w(6,'Sampah plastik yang menumpuk di sungai merusak ekosistem dan memicu banjir. Banyak warga masih membuang sampah sembarangan karena fasilitas kurang. Pemerintah daerah perlu menyediakan tempat sampah memadai sekaligus mengedukasi warga.\nGagasan utama paragraf tersebut adalah ....',['Sampah plastik merusak ekosistem sungai','Banjir disebabkan oleh sampah','Warga kekurangan fasilitas pembuangan','Pemerintah daerah perlu menyediakan fasilitas dan edukasi untuk mengatasi sampah di sungai','Pemerintah harus menghukum pembuang sampah'],3,'Paragraf menjelaskan masalah lalu solusi; gagasan utama mencakup solusi tersebut.','Gagasan utama mencakup isi seluruh paragraf.'),
w(6,'Setiap pagi ia menyiapkan bahan, memasak, lalu menata dagangan sebelum matahari terbit. Sore hari ia masih melayani pembeli dengan senyum. Malam hari ia mencatat keuangan dengan teliti. Pedagang kecil itu ternyata sangat gigih dan tekun dalam usahanya.\nGagasan utama paragraf tersebut adalah ....',['Pedagang menyiapkan dagangan pagi hari','Pembeli dilayani dengan senyum','Keuangan dicatat dengan teliti','Usaha dagang dimulai sebelum matahari terbit','Pedagang kecil itu gigih dan tekun dalam usahanya'],4,'Paragraf induktif: rincian di awal, simpulan di akhir.','Induktif: ide pokok di kalimat terakhir.'),

function shell(inner,adm){const BK=adm?"V='dash';location.hash=''":({materi:"go('dash')",rank:"go('dash')",brief:"go('dash')",exam:"exitEx()",result:"go('dash')"})[V]||'';const n=(v,l)=>`<a class="${V==v?'on':''}" onclick="go('${v}')">${l}</a>`;

function auth(msg){shell(`<div class="card" style="max-width:380px;margin:30px auto"><h2>Masuk / Daftar Peserta</h2><input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password"><div class="row"><button class="btn" onclick="login()">Masuk</button><button class="btn g" onclick="reg()">Daftar</button></div><p class="no">${msg||''}</p><p class="mu">Data tersimpan di browser perangkat ini.</p></div>`)}
function login(){U=L('u')||{};const u=$('u').value.trim(),p=$('p').value;if(U[u]&&U[u].p==hs(p)){if(U[u].st=='blok')return auth('Akun Anda diblokir. Hubungi pemilik untuk persetujuan.');if(U[u].st=='pending')return auth('Akun menunggu persetujuan pemilik.');cur=u;U[u].last=new Date().toISOString();S('u',U);S('ses',u);V='dash';route()}else auth('Username atau password salah.')}
function reg(){U=L('u')||{};const u=$('u').value.trim(),p=$('p').value;if(u.length<3||p.length<4)return auth('Username min. 3 & password min. 4 karakter.');if(U[u])return auth('Username sudah dipakai.');const pn=L('apv');U[u]={p:hs(p),last:new Date().toISOString(),hist:[],st:pn?'pending':'ok'};S('u',U);if(pn)return auth('Pendaftaran berhasil. Tunggu persetujuan pemilik.');cur=u;S('ses',u);V='dash';route()}
function chart(h){if(h.length<1)return '<p class="mu">Belum ada riwayat tryout.</p>';const w=300,ht=110,mx=550,pts=h.map((x,i)=>[h.length>1?10+i*(w-20)/(h.length-1):w/2,ht-8-x.tot/mx*(ht-20)]);
return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;max-width:520px"><polyline fill="none" stroke="#2563eb" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2563eb"/><text x="${p[0]}" y="${p[1]-6}" font-size="9" text-anchor="middle" fill="currentColor">${h[i].tot}</text>`).join('')}</svg>`}

const M={TWK:{n:'Tes Wawasan Kebangsaan \u00b7 30 soal \u00b7 maks 150 \u00b7 passing grade 65',d:'Delapan tema: Pancasila, UUD 1945, Nasionalisme, Pilar NKRI, Integritas, Bela Negara, Gagasan Utama, dan Kalimat Efektif. Soal banyak berupa studi kasus sikap.',s:[
{t:'1. Implementasi Pancasila',i:['Lambang: bintang, rantai, pohon beringin, kepala banteng, padi dan kapas.','Sejarah: BPUPKI 29 Mei-1 Juni 1945, Piagam Jakarta 22 Juni 1945, PPKI 18 Agustus 1945.','Pengamalan: toleransi (1), kemanusiaan (2), persatuan (3), musyawarah (4), keadilan sosial (5).'],k:'Cocokkan sikap di soal dengan inti sila, lalu pilih yang inklusif dan setara.'},
{t:'2. Implementasi UUD 1945',i:['Pasal 1: (1) negara kesatuan republik, (2) kedaulatan rakyat, (3) negara hukum.','Pasal 24C MK; 27 persamaan dan bela negara (3); 28 HAM, 28E(3) kebebasan berpendapat; 29 agama; 30 pertahanan; 31 pendidikan; 32 kebudayaan; 33 ekonomi; 34 kesejahteraan.','Amandemen 4 kali (1999-2002); MK menguji UU terhadap UUD, MA menguji aturan di bawah UU.'],k:'Hafalkan pasal inti dan kata kunci tiap pasal.'},
{t:'3. Nasionalisme',i:['Tonggak: Budi Utomo 20 Mei 1908, Sumpah Pemuda 28 Oktober 1928 (Kongres Pemuda II), Proklamasi 17 Agustus 1945, Hari Pahlawan 10 November.','Wujud: bangga budaya, pakai produk lokal, menjaga persatuan, rela berkorban.'],k:'Pilih sikap bangga, positif, dan memajukan bangsa tanpa merendahkan pihak lain.'},
{t:'4. Pilar NKRI',i:['Bhinneka Tunggal Ika dari Kakawin Sutasoma karya Mpu Tantular.','Deklarasi Djuanda 1957, UNCLOS 1982, ZEE 200 mil laut, Wawasan Nusantara.','Otonomi daerah; urusan absolut pusat: pertahanan, keamanan, politik luar negeri, yustisi, moneter fiskal, agama.','Ancaman: separatisme, radikalisme, intoleransi, hoaks.'],k:'Pada kasus, pilih menjaga keutuhan lewat dialog, verifikasi, dan jalur hukum.'},
{t:'5. Integritas',i:['9 nilai antikorupsi KPK: jujur, peduli, mandiri, disiplin, tanggung jawab, kerja keras, sederhana, berani, adil.','Gratifikasi terkait jabatan: tolak dan laporkan ke unit pengendalian gratifikasi.','BerAKHLAK: Berorientasi pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif.'],k:'Jujur, mengakui kesalahan, lapor lewat jalur resmi, tegas tetapi santun.'},
{t:'6. Bela Negara',i:['Nilai dasar (UU 3/2002): cinta tanah air, sadar berbangsa dan bernegara, yakin Pancasila, rela berkorban, kemampuan awal bela negara.','Pasal 27 ayat (3) hak dan kewajiban bela negara; Pasal 30 Sishankamrata.','Bentuk nonfisik: disiplin bekerja, bantu bencana, menjaga keamanan siber.'],k:'Pilih kontribusi nyata sesuai kemampuan dan terkoordinasi.'},
{t:'7. Gagasan Utama',i:['Deduktif: ide pokok di awal. Induktif: di akhir. Campuran: awal dan akhir.','Gagasan utama harus mencakup seluruh isi paragraf, bukan satu rincian.','Penanda simpulan: jadi, karena itu, dengan demikian.'],k:'Cari kalimat yang bisa merangkum semua kalimat lain.'},
{t:'8. Kalimat Efektif',i:['Hindari pemborosan: para + jamak (para tamu-tamu), naik ke atas, agar supaya, sekitar kurang lebih.','Kalimat harus bersubjek jelas; kata depan di awal menghilangkan subjek.','Paralel: rincian memakai bentuk kata sama (menyusun, memeriksa, menyimpan).','Gunakan kata baku: praktik, apotek, risiko, izin, nasihat.'],k:'Periksa subjek, kata mubazir, dan kesejajaran bentuk.'}]},
TIU:{n:'Tes Intelegensia Umum · 35 soal · maks 175 · passing grade 80',d:'Tiga kelompok: Verbal, Numerik, dan Figural. Polanya makin bertingkat, jadi kenali jenisnya dulu.',s:[
{t:'1. Verbal: Sinonim, Antonim, Analogi',i:['Sinonim = padanan makna; antonim = lawan makna. Biasakan kosakata baku KBBI dan kata serapan.','Hubungan analogi: sebab-akibat, bagian-keseluruhan, fungsi, jenis, alat-hasil, tingkatan.','Waspadai pilihan yang maknanya mirip tetapi tidak setepat kata soal.'],k:'Buat kalimat hubungan “A adalah ... dari B”, lalu uji kalimat itu pada setiap pilihan.'},
{t:'2. Silogisme dan Logika',i:['Silogisme: Semua A adalah B; semua B adalah C, maka semua A adalah C.','Kontraposisi: p maka q setara dengan bukan q maka bukan p. Invers dan konvers tidak setara.','“Tidak semua A adalah B” berarti ada A yang bukan B.','Penalaran analitis (urutan, posisi, jadwal): buat tabel atau diagram.'],k:'Gambar diagram Venn dan coret opsi yang belum pasti benar.'},
{t:'3. Numerik: Aritmetika dan Soal Cerita',i:['Persen cepat: 10% = ÷10, 25% = ÷4, 12,5% = ÷8, 50% = ÷2.','Kecepatan v = s/t; kecepatan rata-rata = jarak total ÷ waktu total. Pekerjaan bersama: 1/t1 + 1/t2.','Rata-rata, KPK-FPB, pecahan, perbandingan senilai dan berbalik nilai, bunga sederhana.','Soal cerita panjang: tandai dulu yang ditanya, abaikan angka pengecoh.'],k:'Samakan satuan lebih dulu, gunakan pembulatan dan perkiraan, lalu eliminasi opsi yang jauh.'},
{t:'4. Deret Angka dan Tabel',i:['Aritmetika Un = a + (n-1)b; geometri Un = a x r^(n-1); deret bertingkat, Fibonacci, bilangan prima, kuadrat, kubik.','Hafalkan kuadrat 1-25 dan kubik 1-10.','Tabel X-Y: cari Y = aX + b dengan a = selisih Y ÷ selisih X. Jika selisih Y ikut naik tetap, polanya kuadrat.','Contoh: X = 2, 5, 8, 11 dan Y = 5, 14, 23 menghasilkan a = 3 dan b = -1, jadi Y = 3X - 1 = 32.'],k:'Urutan cek: selisih, rasio, selisih bertingkat, kuadrat/kubik, lalu pola selang-seling.'},
{t:'5. Figural',i:['Jenis: analogi gambar, serial gambar, ketidaksamaan gambar.','Pola umum: rotasi (45° atau 90°), pencerminan, penambahan atau pengurangan elemen, perubahan warna atau posisi.','Periksa satu elemen per langkah, jangan seluruh gambar sekaligus.'],k:'Fokus pada satu komponen, tentukan aturan perubahannya, lalu coret opsi yang tidak konsisten.'}]},
TKP:{n:'Tes Karakteristik Pribadi · 45 soal · maks 225 · passing grade 156',d:'Tidak ada jawaban salah. Setiap pilihan bernilai 1-5, dan pilihan terbaik biasanya yang solutif, sesuai aturan, dan kolaboratif.',s:[
{t:'1. Pelayanan Publik',i:['Layani cepat, ramah, empati, dan sesuai SOP tanpa membedakan siapa pun.','Hadapi komplain dengan tenang, dengarkan dulu, lalu beri solusi nyata.','Jika di luar kewenangan, arahkan dengan jelas ke pihak yang tepat, jangan menolak mentah-mentah.'],k:'Skor 5 umumnya: tenang + empati + solusi tuntas sesuai prosedur.'},
{t:'2. Jejaring Kerja dan Sosial Budaya',i:['Kolaborasi, komunikasi terbuka, saling membantu rekan lintas unit.','Hormati perbedaan suku, agama, budaya; adaptif terhadap lingkungan baru.','Selesaikan konflik lewat dialog, bukan menegur di depan umum atau menghindar.'],k:'Pilih tindakan yang membangun hubungan dan mengajak diskusi.'},
{t:'3. Teknologi Informasi dan Komunikasi',i:['Mau belajar teknologi baru lewat pelatihan dan latihan mandiri.','Manfaatkan teknologi untuk efisiensi kerja dan pelayanan.','Jaga keamanan data dan kerahasiaan informasi instansi.'],k:'Pilih opsi yang proaktif belajar dan memanfaatkan teknologi dengan aman.'},
{t:'4. Profesionalisme dan Integritas',i:['Tanggung jawab, disiplin waktu, kompetensi, inisiatif, dan akuntabilitas.','Terima tugas di luar bidang dengan belajar dan meminta arahan bila perlu.','Tolak gratifikasi dan penyalahgunaan wewenang; lapor lewat jalur resmi.'],k:'Kata kunci 5: bertanggung jawab, inisiatif, belajar, sesuai aturan.'},
{t:'5. Anti Radikalisme',i:['Tolak paham dan ajakan kekerasan atau intoleransi.','Pegang Pancasila dan NKRI; utamakan dialog dan edukasi.','Laporkan potensi ancaman kepada pihak berwenang, jangan main hakim sendiri.'],k:'Pilih sikap tegas menolak kekerasan namun tetap persuasif dan sesuai hukum.'},
{t:'6. Strategi Mengerjakan Seluruh SKD',i:['Waktu 100 menit untuk 110 soal. Saran alokasi: TWK ±25 menit, TIU ±40 menit, TKP ±35 menit.','TKP: selalu isi semua soal karena tidak ada nilai 0; pilihan terburuk pun bernilai minimal 1.','TIU: lewati soal yang menyita waktu, tandai Ragu-Ragu, kembali di akhir.','Passing grade: TWK 65, TIU 80, TKP 156, dan ketiganya wajib terpenuhi.'],k:'Kerjakan bagian yang paling kamu kuasai dulu, sisakan 5 menit untuk memeriksa soal ragu-ragu.'}]}};
let mt='TWK';
function materi(){shell(`<div class="tabs">${Object.keys(M).map(c=>`<button class="${c==mt?'on':''}" onclick="mt='${c}';materi()">${c}</button>`).join('')}</div><div class="card"><h3>${M[mt].n}</h3><p class="mu">${M[mt].d}</p>${M[mt].s.map(m=>`<details><summary>${m.t}</summary><ul>${m.i.map(x=>`<li>${e(x)}</li>`).join('')}</ul><div class="trik">⚡ <b>Cara Menjawab Kilat:</b> ${e(m.k)}</div></details>`).join('')}</div>`)}
function rank(){const r=Object.keys(U).map(n=>({n,b:Math.max(0,...U[n].hist.map(x=>x.tot)),c:U[n].hist.length})).filter(x=>x.c).sort((a,b)=>b.b-a.b).slice(0,10);
shell(`<div class="card"><h3>🏆 Peringkat Skor Tertinggi</h3><table><tr><th>#</th><th>Peserta</th><th>Skor Terbaik</th><th>Tryout</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>${x.b}</td><td>${x.c}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">Belum ada data.</td></tr>'}</table><p class="mu">Peringkat mencakup peserta pada perangkat/browser ini.</p></div>`)}
function brief(){shell(`<div class="card"><h2>Petunjuk Ujian CAT SKD</h2><ul><li>Waktu <b>100 menit</b> untuk seluruh bagian. Timer mulai berjalan saat tombol Start ditekan.</li><li>Ada tiga bagian: <b>TWK</b>, <b>TIU</b>, <b>TKP</b>. Kamu bebas mulai dari bagian mana pun dengan menekan tab TWK / TIU / TKP di atas soal.</li><li>TWK dan TIU: jawaban benar +5, salah atau kosong 0. TKP: bobot 1 sampai 5 sesuai pilihan.</li><li>Nomor soal: biru = sudah dijawab, kuning = ragu-ragu, abu-abu = belum dijawab.</li><li>Passing grade: TWK 65, TIU 80, TKP 156 (semuanya harus terpenuhi).</li><li>Ujian berakhir saat waktu habis atau saat kamu menekan Selesai Ujian. Pembahasan tersedia setelahnya.</li></ul><p class="mu">Paket ini berisi ${allQ().length} soal.</p><button class="btn ok" style="width:100%" onclick="startExam()">Start Ujian</button></div>`)}
function startExam(){const QT={TWK:30,TIU:35,TKP:45},q=['TWK','TIU','TKP'].flatMap(c=>sh(allQ().filter(x=>x.c==c)).slice(0,QT[c]));ex={qs:q,a:q.map(()=>null),s:q.map(()=>0),i:0,left:6000};V='exam';clearInterval(tmr);tmr=setInterval(()=>{ex.left--;const t=$('tm');if(t)t.textContent=fmt(ex.left);if(ex.left<=0){clearInterval(tmr);alert('Waktu habis!');finish()}},1000);route()}
function examUI(){const q=ex.qs[ex.i];shell(`<div class="ex"><div class="card q"><div class="tabs">${['TWK','TIU','TKP'].map(c=>`<button class="${q.c==c?'on':''}" onclick="ex.i=Math.max(0,ex.qs.findIndex(x=>x.c=='${c}'));examUI()">${c}</button>`).join('')}</div><div class="row" style="justify-content:space-between"><span class="tag">${q.c}${q.tm?" · "+q.tm:""}</span><b>Soal ${ex.i+1} dari ${ex.qs.length}</b></div><p style="font-size:17px;margin:14px 0">${e(q.t)}</p>${q.o.map((o,k)=>`<button class="opt ${ex.a[ex.i]===k?'s':''}" onclick="pick(${k})"><b>${'ABCDE'[k]}.</b> ${e(o)}</button>`).join('')}<div class="bar"><button class="btn g" onclick="mv(-1)">Sebelumnya</button><button class="btn y" onclick="doubt()">Ragu-Ragu</button><button class="btn" onclick="mv(1)">Selanjutnya</button></div></div>
<div class="card nv"><div>Sisa waktu <span class="tm" id="tm">${fmt(ex.left)}</span></div><div class="grid" style="margin:12px 0">${ex.qs.map((_,i)=>`<button class="${ex.s[i]==2?'d':ex.s[i]==1?'a':''} ${i==ex.i?'cur':''}" onclick="ex.i=${i};examUI()">${i+1}</button>`).join('')}</div><p class="mu">🟦 Dijawab · 🟨 Ragu-ragu · ⬜ Belum</p><button class="btn r" style="width:100%" onclick="if(confirm('Selesaikan ujian?'))finish()">Selesai Ujian</button></div></div>`)}
function exitEx(){if(confirm('Keluar dari ujian? Jawaban tidak akan disimpan.')){clearInterval(tmr);ex=null;go('dash')}}
function pick(k){ex.a[ex.i]=k;if(ex.s[ex.i]!=2)ex.s[ex.i]=1;examUI()}
function doubt(){ex.s[ex.i]=ex.s[ex.i]==2?(ex.a[ex.i]!==null?1:0):2;examUI()}
function mv(d){const n=ex.i+d;if(n>=0&&n<ex.qs.length){ex.i=n;examUI()}}
function finish(){clearInterval(tmr);const r={TWK:0,TIU:0,TKP:0},n={TWK:0,TIU:0,TKP:0};ex.qs.forEach((q,i)=>{r[q.c]+=sc(q,ex.a[i]);n[q.c]+=5});
const p=c=>n[c]?Math.round(r[c]/n[c]*FULL[c]):0,tw=p('TWK'),ti=p('TIU'),tk=p('TKP'),ok=tw>=PG.TWK&&ti>=PG.TIU&&tk>=PG.TKP;
const h={d:new Date().toLocaleString('id-ID'),tw,ti,tk,tot:tw+ti+tk,ok,dur:fmt(6000-Math.max(0,ex.left))};U[cur].hist.push(h);S('u',U);R={h,qs:ex.qs,a:ex.a};ex=null;V='result';route()}
function result(){const h=R.h;shell(`<div class="card"><h2>Hasil Ujian</h2><div class="row"><div class="stat">TWK<b>${h.tw}</b></div><div class="stat">TIU<b>${h.ti}</b></div><div class="stat">TKP<b>${h.tk}</b></div><div class="stat">Total<b>${h.tot}</b><span class="${h.ok?'ok':'no'}">${h.ok?'LULUS passing grade':'Belum lulus passing grade'}</span></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="go('dash')">Dashboard</button><button class="btn ok" onclick="startExam()">Ulangi Ujian</button></div></div>
<h3>Pembahasan</h3>${R.qs.map((q,i)=>{const a=R.a[i],ans=q.c=='TKP'?`kunci terbaik: ${'ABCDE'[q.w.indexOf(Math.max(...q.w))]}`:`kunci: ${'ABCDE'[q.k]}`;return `<div class="card"><span class="tag">${q.c}${q.tm?" · "+q.tm:""}</span> <b>No ${i+1}</b><p>${e(q.t)}</p><p>Jawabanmu: <b class="${a!==null&&sc(q,a)==(q.c=='TKP'?5:5)?'ok':'no'}">${a===null?'kosong':'ABCDE'[a]+(q.c=='TKP'?' (bobot '+q.w[a]+')':'')}</b> · ${ans}</p><p>${e(q.p||'')}</p>${q.tr?`<div class="trik">⚡ ${e(q.tr)}</div>`:''}</div>`}).join('')}`)}
function admin(){V='adm';if(!L('adm'))return shell(`<div class="card" style="max-width:380px;margin:30px auto"><h2>Buat Password Admin</h2><input id="ap" type="password" placeholder="Password baru (min 6)"><button class="btn" onclick="setAdm()">Simpan</button></div>`,1);
if(!admOK)return shell(`<div class="card" style="max-width:380px;margin:30px auto"><h2>Login Pemilik</h2><input id="ap" type="password" placeholder="Password admin"><button class="btn" onclick="loginAdm()">Masuk</button></div>`,1);
U=L('u')||{};const qb=L('qb')||[];
shell(`<div class="card"><label><input type="checkbox" ${L('apv')?'checked':''} onchange="S('apv',this.checked)" style="width:auto"> Pendaftar baru harus saya setujui dulu</label></div><div class="card sc"><h3>Rekap Peserta (${Object.keys(U).length})</h3><table><tr><th>Peserta</th><th>Login terakhir</th><th>Tryout</th><th>Nilai terakhir</th><th>Status</th><th>Akses</th><th>Aksi</th></tr>${Object.keys(U).map(n=>{const h=U[n].hist,l=h[h.length-1],N=`decodeURIComponent('${encodeURIComponent(n)}')`;return `<tr><td>${e(n)}</td><td>${new Date(U[n].last).toLocaleString('id-ID')}</td><td>${h.length}</td><td>${l?l.tot+' ('+l.dur+')':'-'}</td><td class="${l&&l.ok?'ok':'no'}">${l?(l.ok?'Lulus':'Belum'):'-'}</td><td>${st(U[n].st)}</td><td style="white-space:nowrap">${U[n].st=='blok'||U[n].st=='pending'?`<button class="btn ok" onclick="setSt(${N},'ok')">Setujui</button>`:`<button class="btn y" onclick="setSt(${N},'blok')">Blokir</button>`} <button class="btn r" onclick="delU(${N})">Hapus</button></td></tr>`}).join('')}</table></div>
<div class="card"><h3>Tambah Soal (bank: ${B.length+T.length+UB.length+TK.length} bawaan + ${qb.length} tambahan)</h3><select id="nc"><option>TWK</option><option>TIU</option><option>TKP</option></select><textarea id="nt" rows="3" placeholder="Teks soal"></textarea><textarea id="no" rows="5" placeholder="5 opsi, satu per baris (A sampai E)"></textarea><input id="nk" placeholder="Kunci: huruf (A-E) untuk TWK/TIU, atau 5 bobot TKP mis. 1,5,3,2,4"><textarea id="np" rows="2" placeholder="Pembahasan"></textarea><input id="nr" placeholder="Trik cepat (opsional)"><div class="row"><button class="btn ok" onclick="addQ()">Simpan Soal</button><button class="btn r" onclick="if(confirm('Hapus semua soal tambahan?')){S('qb',[]);admin()}">Hapus Soal Tambahan</button></div></div>
<button class="btn g" onclick="admOK=false;admin()">Kunci Panel</button>`,1)}
function setAdm(){const p=$('ap').value;if(p.length<6)return alert('Min. 6 karakter');S('adm',hs(p));admOK=true;admin()}
function loginAdm(){if(hs($('ap').value)==L('adm')){admOK=true;admin()}else alert('Password salah')}
const st=s=>s=='blok'?'<b class="no">Diblokir</b>':s=='pending'?'<b style="color:#ca8a04">Menunggu</b>':'<b class="ok">Aktif</b>';function setSt(n,s){U=L('u')||{};if(U[n]){U[n].st=s;S('u',U)}admin()}function delU(n){if(confirm('Hapus '+n+'?')){delete U[n];S('u',U);admin()}}
function addQ(){const o=$('no').value.split('\n').map(s=>s.trim()).filter(Boolean),c=$('nc').value,k=$('nk').value.trim().toUpperCase(),t=$('nt').value.trim();if(!t||o.length!=5)return alert('Isi soal dan tepat 5 opsi.');
const q={c,t,o,p:$('np').value,tr:$('nr').value};if(c=='TKP'){const w=k.split(',').map(Number);if(w.length!=5||w.some(x=>!(x>=1&&x<=5)))return alert('TKP: 5 bobot 1-5');q.w=w}else{const i='ABCDE'.indexOf(k);if(k.length!=1||i<0)return alert('Kunci harus A-E');q.k=i}
const qb=L('qb')||[];qb.push(q);S('qb',qb);admin()}
addEventListener('hashchange',route);route();
</script></body></html>
