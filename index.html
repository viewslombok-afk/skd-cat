<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAT SKD Simulator</title>
<style>
:root{--bg:#f3f4f6;--c:#fff;--tx:#1f2937;--mu:#6b7280;--p:#1e3a8a;--b:#d1d5db;--bl:#2563eb;--y:#facc15;--g:#e5e7eb;--ok:#16a34a;--no:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--c:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--p:#1e40af;--b:#374151;--g:#374151;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Segoe UI',system-ui,sans-serif}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header nav{display:flex;gap:6px;flex-wrap:wrap}header a,.btn{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;background:var(--bl);color:#fff}
header a{background:rgba(255,255,255,.15)}header a.on{background:#fff;color:var(--p)}
main{max-width:1000px;margin:0 auto;padding:14px}.card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
h2,h3{margin:0 0 10px}input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--tx);font:inherit}
.btn.y{background:#ca8a04}.btn.r{background:var(--no)}.btn.g{background:var(--g);color:var(--tx)}.btn.ok{background:var(--ok);color:#fff}.btn.y,.btn.r{color:#fff}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.tabs .on{background:var(--bl);color:#fff;border-color:var(--bl)}details{border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:8px 0}summary{font-weight:700;cursor:pointer}details ul{margin:8px 0;padding-left:20px}.back{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;margin-right:10px}.nv .grid{max-height:260px;overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.mu{color:var(--mu);font-size:13px}
.stat{text-align:center;padding:10px;border-radius:10px;background:var(--bg)}.stat b{display:block;font-size:24px}
.ok{color:var(--ok)}.no{color:var(--no)}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--b);background:var(--c);color:var(--tx);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;font:inherit}.opt.s{border-color:var(--bl);background:rgba(37,99,235,.15)}
.ex{display:flex;gap:14px;flex-wrap:wrap}.ex .q{flex:3;min-width:280px}.ex .nv{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{height:38px;border-radius:8px;border:1px solid var(--b);background:var(--g);color:var(--tx);font-weight:700;cursor:pointer}
.grid .a{background:var(--bl);color:#fff}.grid .d{background:var(--y);color:#111}.grid .cur{outline:3px solid #93c5fd}
.tm{font:700 20px monospace;color:var(--y)}.trik{background:rgba(250,204,21,.18);border-left:4px solid var(--y);padding:8px 12px;border-radius:6px;margin-top:8px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.bar{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
</style></head><body>
<div id="app"></div>
<script>
const FULL={TWK:150,TIU:175,TKP:225},PG={TWK:65,TIU:80,TKP:156}; // sesuaikan passing grade dengan aturan terbaru
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(x){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g,'<br>');
const hs=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return String(x)};
let U=L('u')||{},cur=L('ses'),V='dash',ex=null,R=null,tmr=null,admOK=false;
const allQ=()=>[];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sc=(q,a)=>a==null?0:q.c=='TKP'?q.w[a]:(a==q.k?5:0);
const fmt=s=>[s/3600|0,s%3600/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');
function shell(inner,adm){const BK=adm?"V='dash';location.hash=''":({materi:"go('dash')",rank:"go('dash')",brief:"go('dash')",exam:"exitEx()",result:"go('dash')",latihan:"go('dash')"})[V]||'';const n=(v,l)=>`<a class="${V==v?'on':''}" onclick="go('${v}')">${l}</a>`;
$('app').innerHTML=`<header><div style="display:flex;align-items:center">${BK?`<button class="back" onclick="${BK}">← Kembali</button>`:''}<div><b>CAT SKD SIMULATOR</b><div class="mu" style="color:#bfdbfe">${adm?'Panel Pemilik':cur?'Halo, '+e(cur):'Silakan masuk'}</div></div></div>${cur&&!adm&&V!='exam'?`<nav>${n('dash','Dashboard')}${n('materi','Materi')}${n('latihan','Latihan')}${n('rank','Peringkat')}<a onclick="logout()">Keluar</a></nav>`:''}</header><main>${inner}</main>`}
function go(v){V=v;route()}
function logout(){cur=null;S('ses',null);V='dash';route()}
function route(){if(location.hash=='#pemilik01')return admin();U=L('u')||{};if(cur&&(!U[cur]||U[cur].st=='blok'||U[cur].st=='pending')){const m=!U[cur]?'Akun tidak ditemukan.':U[cur].st=='blok'?'Akun Anda diblokir oleh pemilik.':'Akun menunggu persetujuan pemilik.';cur=null;S('ses',null);V='dash';return auth(m)}if(!cur)return auth();({dash,materi,rank,brief,exam:examUI,result,latihan})[V]()}
function auth(msg){shell(`<div class="card" style="max-width:380px;margin:30px auto"><h2>Masuk / Daftar Peserta</h2><input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password"><div class="row"><button class="btn" onclick="login()">Masuk</button><button class="btn g" onclick="reg()">Daftar</button></div><p class="no">${msg||''}</p><p class="mu">Data tersimpan di browser perangkat ini.</p></div>`)}
function login(){U=L('u')||{};const u=$('u').value.trim(),p=$('p').value;if(U[u]&&U[u].p==hs(p)){if(U[u].st=='blok')return auth('Akun Anda diblokir. Hubungi pemilik untuk persetujuan.');if(U[u].st=='pending')return auth('Akun menunggu persetujuan pemilik.');cur=u;U[u].last=new Date().toISOString();S('u',U);S('ses',u);V='dash';route()}else auth('Username atau password salah.')}
function reg(){U=L('u')||{};const u=$('u').value.trim(),p=$('p').value;if(u.length<3||p.length<4)return auth('Username min. 3 & password min. 4 karakter.');if(U[u])return auth('Username sudah dipakai.');const pn=L('apv');U[u]={p:hs(p),last:new Date().toISOString(),hist:[],st:pn?'pending':'ok'};S('u',U);if(pn)return auth('Pendaftaran berhasil. Tunggu persetujuan pemilik.');cur=u;S('ses',u);V='dash';route()}
function chart(h){if(h.length<1)return '<p class="mu">Belum ada riwayat tryout.</p>';const w=300,ht=110,mx=550,pts=h.map((x,i)=>[h.length>1?10+i*(w-20)/(h.length-1):w/2,ht-8-x.tot/mx*(ht-20)]);
return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;max-width:520px"><polyline fill="none" stroke="#2563eb" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2563eb"/><text x="${p[0]}" y="${p[1]-6}" font-size="9" text-anchor="middle" fill="currentColor">${h[i].tot}</text>`).join('')}</svg>`}
function dash(){const h=U[cur].hist,l=h[h.length-1],pr=h[h.length-2],d=l&&pr?l.tot-pr.tot:null;
shell(`<div class="card"><h2>Nilai Terbaru</h2>${l?`<div class="row"><div class="stat">TWK<b class="${l.tw>=PG.TWK?'ok':'no'}">${l.tw}</b><span class="mu">min ${PG.TWK}</span></div><div class="stat">TIU<b class="${l.ti>=PG.TIU?'ok':'no'}">${l.ti}</b><span class="mu">min ${PG.TIU}</span></div><div class="stat">TKP<b class="${l.tk>=PG.TKP?'ok':'no'}">${l.tk}</b><span class="mu">min ${PG.TKP}</span></div><div class="stat">Total<b>${l.tot}</b><span class="${l.ok?'ok':'no'}">${l.ok?'LULUS':'BELUM LULUS'}</span></div></div>${d!==null?`<p>${d>0?'📈 Naik':d<0?'📉 Turun':'➖ Stagnan'} ${Math.abs(d)} poin dari tryout sebelumnya.</p>`:''}`:'<p class="mu">Belum ada tryout. Mulai sekarang!</p>'}</div>
<div class="card"><h3>Grafik Riwayat Total Nilai</h3>${chart(h)}</div>
<div class="card"><h3>Tryout CAT (110 soal · 100 menit)</h3><p class="mu">Skor diproyeksikan ke skala penuh SKD (TWK 150, TIU 175, TKP 225) bila paket kurang dari 110 soal.</p><button class="btn ok" onclick="go('brief')">Klik untuk Ujian</button> <button class="btn" onclick="go('latihan')">Latihan Soal</button></div>
<div class="card sc"><h3>Riwayat</h3><table><tr><th>Tanggal</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Waktu</th><th>Status</th></tr>${h.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.tw}</td><td>${x.ti}</td><td>${x.tk}</td><td>${x.tot}</td><td>${x.dur}</td><td class="${x.ok?'ok':'no'}">${x.ok?'Lulus':'Belum'}</td></tr>`).join('')}</table></div>`)}
const M={TWK:{n:'Tes Wawasan Kebangsaan \u00b7 30 soal \u00b7 maks 150 \u00b7 passing grade 65',d:'Delapan tema: Pancasila, UUD 1945, Nasionalisme, Pilar NKRI, Integritas, Bela Negara, Gagasan Utama, dan Kalimat Efektif. Soal banyak berupa studi kasus sikap.',s:[
{t:'1. Implementasi Pancasila',i:['Lambang: bintang, rantai, pohon beringin, kepala banteng, padi dan kapas.','Sejarah: BPUPKI 29 Mei-1 Juni 1945, Piagam Jakarta 22 Juni 1945, PPKI 18 Agustus 1945.','Pengamalan: toleransi (1), kemanusiaan (2), persatuan (3), musyawarah (4), keadilan sosial (5).'],k:'Cocokkan sikap di soal dengan inti sila, lalu pilih yang inklusif dan setara.'},
{t:'2. Implementasi UUD 1945',i:['Pasal 1: (1) negara kesatuan republik, (2) kedaulatan rakyat, (3) negara hukum.','Pasal 24C MK; 27 persamaan dan bela negara (3); 28 HAM, 28E(3) kebebasan berpendapat; 29 agama; 30 pertahanan; 31 pendidikan; 32 kebudayaan; 33 ekonomi; 34 kesejahteraan.','Amandemen 4 kali (1999-2002); MK menguji UU terhadap UUD, MA menguji aturan di bawah UU.'],k:'Hafalkan pasal inti dan kata kunci tiap pasal.'},
{t:'3. Nasionalisme',i:['Tonggak: Budi Utomo 20 Mei 1908, Sumpah Pemuda 28 Oktober 1928 (Kongres Pemuda II), Proklamasi 17 Agustus 1945, Hari Pahlawan 10 November.','Wujud: bangga budaya, pakai produk lokal, menjaga persatuan, rela berkorban.'],k:'Pilih sikap bangga, positif, dan memajukan bangsa tanpa merendahkan pihak lain.'},
{t:'4. Pilar NKRI',i:['Bhinneka Tunggal Ika dari Kakawin Sutasoma karya Mpu Tantular.','Deklarasi Djuanda 1957, UNCLOS 1982, ZEE 200 mil laut, Wawasan Nusantara.','Otonomi daerah; urusan absolut pusat: pertahanan, keamanan, politik luar negeri, yustisi, moneter fiskal, agama.','Ancaman: separatisme, radikalisme, intoleransi, hoaks.'],k:'Pada kasus, pilih menjaga keutuhan lewat dialog, verifikasi, dan jalur hukum.'},
{t:'5. Integritas',i:['9 nilai antikorupsi KPK: jujur, peduli, mandiri, disiplin, tanggung jawab, kerja keras, sederhana, berani, adil.','Gratifikasi terkait jabatan: tolak dan laporkan ke unit pengendalian gratifikasi.','BerAKHLAK: Berorientasi pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif.'],k:'Jujur, mengakui kesalahan, lapor lewat jalur resmi, tegas tetapi santun.'},
{t:'6. Bela Negara',i:['Nilai dasar (UU 3/2002): cinta tanah air, sadar berbangsa dan bernegara, yakin Pancasila, rela berkorban, kemampuan awal bela negara.','Pasal 27 ayat (3) hak dan kewajiban bela negara; Pasal 30 Sishankamrata.','Bentuk nonfisik: disiplin bekerja, bantu bencana, menjaga keamanan siber.'],k:'Pilih kontribusi nyata sesuai kemampuan dan terkoordinasi.'},
{t:'7. Gagasan Utama',i:['Deduktif: ide pokok di awal. Induktif: di akhir. Campuran: awal dan akhir.','Gagasan utama harus mencakup seluruh isi paragraf, bukan satu rincian.','Penanda simpulan: jadi, karena itu, dengan demikian.'],k:'Cari kalimat yang bisa merangkum semua kalimat lain.'},
{t:'8. Kalimat Efektif',i:['Hindari pemborosan: para + jamak (para tamu-tamu), naik ke atas, agar supaya, sekitar kurang lebih.','Kalimat harus bersubjek jelas; kata depan di awal menghilangkan subjek.','Paralel: rincian memakai bentuk kata sama (menyusun, memeriksa, menyimpan).','Gunakan kata baku: praktik, apotek, risiko, izin, nasihat.'],k:'Periksa subjek, kata mubazir, dan kesejajaran bentuk.'}]},
TIU:{n:'Tes Intelegensia Umum · 35 soal · maks 175 · passing grade 80',d:'Tiga kelompok: Verbal, Numerik, dan Figural. Polanya makin bertingkat, jadi kenali jenisnya dulu.',s:[
{t:'1. Verbal: Sinonim, Antonim, Analogi',i:['Sinonim = padanan makna; antonim = lawan makna. Biasakan kosakata baku KBBI dan kata serapan.','Hubungan analogi: sebab-akibat, bagian-keseluruhan, fungsi, jenis, alat-hasil, tingkatan.','Waspadai pilihan yang maknanya mirip tetapi tidak setepat kata soal.'],k:'Buat kalimat hubungan “A adalah ... dari B”, lalu uji kalimat itu pada setiap pilihan.'},
{t:'2. Silogisme dan Logika',i:['Silogisme: Semua A adalah B; semua B adalah C, maka semua A adalah C.','Kontraposisi: p maka q setara dengan bukan q maka bukan p. Invers dan konvers tidak setara.','“Tidak semua A adalah B” berarti ada A yang bukan B.','Penalaran analitis (urutan, posisi, jadwal): buat tabel atau diagram.'],k:'Gambar diagram Venn dan coret opsi yang belum pasti benar.'},
{t:'3. Numerik: Aritmetika dan Soal Cerita',i:['Persen cepat: 10% = ÷10, 25% = ÷4, 12,5% = ÷8, 50% = ÷2.','Kecepatan v = s/t; kecepatan rata-rata = jarak total ÷ waktu total. Pekerjaan bersama: 1/t1 + 1/t2.','Rata-rata, KPK-FPB, pecahan, perbandingan senilai dan berbalik nilai, bunga sederhana.','Soal cerita panjang: tandai dulu yang ditanya, abaikan angka pengecoh.'],k:'Samakan satuan lebih dulu, gunakan pembulatan dan perkiraan, lalu eliminasi opsi yang jauh.'},
{t:'4. Deret Angka dan Tabel',i:['Aritmetika Un = a + (n-1)b; geometri Un = a x r^(n-1); deret bertingkat, Fibonacci, bilangan prima, kuadrat, kubik.','Hafalkan kuadrat 1-25 dan kubik 1-10.','Tabel X-Y: cari Y = aX + b dengan a = selisih Y ÷ selisih X. Jika selisih Y ikut naik tetap, polanya kuadrat.','Contoh: X = 2, 5, 8, 11 dan Y = 5, 14, 23 menghasilkan a = 3 dan b = -1, jadi Y = 3X - 1 = 32.'],k:'Urutan cek: selisih, rasio, selisih bertingkat, kuadrat/kubik, lalu pola selang-seling.'},
{t:'5. Figural',i:['Jenis: analogi gambar, serial gambar, ketidaksamaan gambar.','Pola umum: rotasi (45° atau 90°), pencerminan, penambahan atau pengurangan elemen, perubahan warna atau posisi.','Periksa satu elemen per langkah, jangan seluruh gambar sekaligus.'],k:'Fokus pada satu komponen, tentukan aturan perubahannya, lalu coret opsi yang tidak konsisten.'}]},
TKP:{n:'Tes Karakteristik Pribadi · 45 soal · maks 225 · passing grade 156',d:'Tidak ada jawaban salah. Setiap pilihan bernilai 1-5, dan pilihan terbaik biasanya yang solutif, sesuai aturan, dan kolaboratif.',s:[
{t:'1. Pelayanan Publik',i:['Layani cepat, ramah, empati, dan sesuai SOP tanpa membedakan siapa pun.','Hadapi komplain dengan tenang, dengarkan dulu, lalu beri solusi nyata.','Jika di luar kewenangan, arahkan dengan jelas ke pihak yang tepat, jangan menolak mentah-mentah.'],k:'Skor 5 umumnya: tenang + empati + solusi tuntas sesuai prosedur.'},
{t:'2. Jejaring Kerja dan Sosial Budaya',i:['Kolaborasi, komunikasi terbuka, saling membantu rekan lintas unit.','Hormati perbedaan suku, agama, budaya; adaptif terhadap lingkungan baru.','Selesaikan konflik lewat dialog, bukan menegur di depan umum atau menghindar.'],k:'Pilih tindakan yang membangun hubungan dan mengajak diskusi.'},
{t:'3. Teknologi Informasi dan Komunikasi',i:['Mau belajar teknologi baru lewat pelatihan dan latihan mandiri.','Manfaatkan teknologi untuk efisiensi kerja dan pelayanan.','Jaga keamanan data dan kerahasiaan informasi instansi.'],k:'Pilih opsi yang proaktif belajar dan memanfaatkan teknologi dengan aman.'},
{t:'4. Profesionalisme dan Integritas',i:['Tanggung jawab, disiplin waktu, kompetensi, inisiatif, dan akuntabilitas.','Terima tugas di luar bidang dengan belajar dan meminta arahan bila perlu.','Tolak gratifikasi dan penyalahgunaan wewenang; lapor lewat jalur resmi.'],k:'Kata kunci 5: bertanggung jawab, inisiatif, belajar, sesuai aturan.'},
{t:'5. Anti Radikalisme',i:['Tolak paham dan ajakan kekerasan atau intoleransi.','Pegang Pancasila dan NKRI; utamakan dialog dan edukasi.','Laporkan potensi ancaman kepada pihak berwenang, jangan main hakim sendiri.'],k:'Pilih sikap tegas menolak kekerasan namun tetap persuasif dan sesuai hukum.'},
{t:'6. Strategi Mengerjakan Seluruh SKD',i:['Waktu 100 menit untuk 110 soal. Saran alokasi: TWK ±25 menit, TIU ±40 menit, TKP ±35 menit.','TKP: selalu isi semua soal karena tidak ada nilai 0; pilihan terburuk pun bernilai minimal 1.','TIU: lewati soal yang menyita waktu, tandai Ragu-Ragu, kembali di akhir.','Passing grade: TWK 65, TIU 80, TKP 156, dan ketiganya wajib terpenuhi.'],k:'Kerjakan bagian yang paling kamu kuasai dulu, sisakan 5 menit untuk memeriksa soal ragu-ragu.'}]}};
let mt='TWK';
function materi(){shell(`<div class="tabs">${Object.keys(M).map(c=>`<button class="${c==mt?'on':''}" onclick="mt='${c}';materi()">${c}</button>`).join('')}</div><div class="card"><h3>${M[mt].n}</h3><p class="mu">${M[mt].d}</p>${M[mt].s.map(m=>`<details><summary>${m.t}</summary><ul>${m.i.map(x=>`<li>${e(x)}</li>`).join('')}</ul><div class="trik">⚡ <b>Cara Menjawab Kilat:</b> ${e(m.k)}</div></details>`).join('')}</div>`)}
function rank(){const r=Object.keys(U).map(n=>({n,b:Math.max(0,...U[n].hist.map(x=>x.tot)),c:U[n].hist.length})).filter(x=>x.c).sort((a,b)=>b.b-a.b).slice(0,10);
shell(`<div class="card"><h3>🏆 Peringkat Skor Tertinggi</h3><table><tr><th>#</th><th>Peserta</th><th>Skor Terbaik</th><th>Tryout</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>${x.b}</td><td>${x.c}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">Belum ada data.</td></tr>'}</table><p class="mu">Peringkat mencakup peserta pada perangkat/browser ini.</p></div>`)}
function brief(){shell(`<div class="card"><h2>Petunjuk Ujian CAT SKD</h2><ul><li>Waktu <b>100 menit</b> untuk seluruh bagian. Timer mulai berjalan saat tombol Start ditekan.</li><li>Ada tiga bagian: <b>TWK</b>, <b>TIU</b>, <b>TKP</b>. Kamu bebas mulai dari bagian mana pun dengan menekan tab TWK / TIU / TKP di atas soal.</li><li>TWK dan TIU: jawaban benar +5, salah atau kosong 0. TKP: bobot 1 sampai 5 sesuai pilihan.</li><li>Nomor soal: biru = sudah dijawab, kuning = ragu-ragu, abu-abu = belum dijawab.</li><li>Passing grade: TWK 65, TIU 80, TKP 156 (semuanya harus terpenuhi).</li><li>Ujian berakhir saat waktu habis atau saat kamu menekan Selesai Ujian. Pembahasan tersedia setelahnya.</li></ul><p class="mu">Paket ini berisi 110 soal.</p><button class="btn ok" style="width:100%" onclick="startExam()">Start Ujian</button></div>`)}

async function showRes(n){const r=await api('admin/results?u='+encodeURIComponent(n));$('rs').innerHTML=`<h3>Nilai ${e(n)}</h3><table><tr><th>Tanggal</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Waktu</th><th>Status</th></tr>${(r.rows||[]).map(x=>`<tr><td>${e(x.created_at)}</td><td>${x.twk}</td><td>${x.tiu}</td><td>${x.tkp}</td><td>${x.total}</td><td>${e(x.duration)}</td><td class="${x.passed?'ok':'no'}">${x.passed?'Lulus':'Belum'}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">Belum ada.</td></tr>'}</table>`}
async function latihan(){if(P)return prUI();const r=await api('themes'),g={};(r.rows||[]).forEach(x=>(g[x.cat]=g[x.cat]||[]).push(x));
shell(`<div class="card"><h2>Mode Latihan</h2><p class="mu">Jawab satu per satu. Setelah memilih, langsung muncul benar/salah, kunci, dan pembahasan. Nilai latihan tidak masuk peringkat.</p></div>${['TWK','TIU','TKP'].map(c=>`<div class="card"><h3>${c}</h3><button class="btn g" style="width:100%;margin-bottom:6px" onclick="startPr('${c}','')">Semua tema ${c}</button>${(g[c]||[]).filter(x=>x.theme).map(x=>`<button class="btn g" style="width:100%;margin-bottom:6px;text-align:left" onclick="startPr('${c}',decodeURIComponent('${encodeURIComponent(x.theme)}'))">${e(x.theme)} (${x.n} soal)</button>`).join('')}</div>`).join('')}`)}
async function startPr(c,t){const r=await api('practice?cat='+c+'&theme='+encodeURIComponent(t));if(!r.qs||!r.qs.length)return alert('Belum ada soal.');P={qs:r.qs,i:0,fb:[],pt:0,ok:0};prUI()}
function prUI(){const q=P.qs[P.i],f=P.fb[P.i],t=q.c=='TKP';shell(`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${q.c}${q.tm?' · '+e(q.tm):''}</span><b>Latihan ${P.i+1} / ${P.qs.length}</b></div><p style="font-size:17px;margin:14px 0">${rq(q.t)}</p>${q.o.map((o,k)=>{let st='';if(f){const best=t?f.w[k]==5:k==f.k;if(best)st='border-color:#16a34a;background:rgba(22,163,74,.15)';else if(k==f.a)st='border-color:#dc2626;background:rgba(220,38,38,.15)'}return `<button class="opt" style="${st}" ${f?'disabled':''} onclick="prPick(${k})"><b>${'ABCDE'[k]}.</b> ${ro(o)}${f&&t?` <span class="mu">(bobot ${f.w[k]})</span>`:''}</button>`}).join('')}${f?`<div class="card" style="margin-top:10px;background:var(--bg)"><b class="${f.good?'ok':'no'}">${t?(f.good?'Jawaban terbaik! +5':'Bobot jawabanmu: '+f.pt):(f.good?'Benar! +5':'Salah')}</b><p>${t?'Kunci terbaik: '+'ABCDE'[f.w.indexOf(5)]:'Kunci: '+'ABCDE'[f.k]}</p><p>${e(f.p||'')}</p>${f.tr?`<div class="trik">⚡ ${e(f.tr)}</div>`:''}</div>`:''}<div class="bar"><button class="btn g" onclick="P=null;latihan()">Keluar</button>${f?(P.i<P.qs.length-1?'<button class="btn" onclick="P.i++;prUI()">Selanjutnya</button>':'<button class="btn ok" onclick="prEnd()">Selesai</button>'):''}</div></div>`)}
async function prPick(k){if(P.fb[P.i])return;const q=P.qs[P.i],r=await api('check',{id:q.id,a:k});if(!r.ok)return alert(r.error);r.a=k;r.good=r.pt==5;P.fb[P.i]=r;P.pt+=r.pt;if(r.good)P.ok++;prUI()}
function prEnd(){const x=P,n=x.qs.length;P=null;shell(`<div class="card"><h2>Latihan Selesai</h2><div class="row"><div class="stat">Benar<b>${x.ok}/${n}</b></div><div class="stat">Poin<b>${x.pt}/${n*5}</b></div></div><div class="row" style="margin-top:12px"><button class="btn ok" onclick="latihan()">Latihan Lagi</button><button class="btn g" onclick="go('dash')">Dashboard</button></div></div>`)}
/* ===== PANDUAN PER TEMA: cara menjawab detail + trik cepat (dipakai di Latihan & Pembahasan Ujian) ===== */
const GD={
'Implementasi Pancasila':{s:['Baca kasus, tandai tindakan atau sikap yang dinilai.','Cocokkan dengan sila lewat kata kunci: ibadah/toleransi agama = sila 1; kemanusiaan/HAM/tidak diskriminatif = sila 2; persatuan/gotong royong = sila 3; musyawarah/mufakat = sila 4; keadilan/hak yang sama = sila 5.','Coret opsi yang memaksakan kehendak, diskriminatif, atau cuek.','Dari sisa opsi, pilih yang paling nyata mengamalkan nilai sila tersebut.'],k:'Cari kata kunci sila, lalu pilih opsi yang inklusif, toleran, dan musyawarah.'},
'Implementasi UUD 1945':{s:['Tentukan topik soal (bentuk negara, HAM, pendidikan, ekonomi, pertahanan, dll.).','Ingat pasal intinya: 1 bentuk negara dan kedaulatan; 27 persamaan dan bela negara; 28 HAM; 29 agama; 30 pertahanan; 31 pendidikan; 32 budaya; 33 ekonomi; 34 kesejahteraan.','Cocokkan kata kunci opsi dengan isi pasal, bukan dengan opini.','Waspadai opsi yang benar secara umum tetapi bukan isi pasal yang ditanyakan.'],k:'Pasangkan kata kunci dengan nomor pasal: hafal 1, 27, 28, 29, 30, 31, 33, 34.'},
'Nasionalisme':{s:['Tentukan konteks soal: fakta sejarah atau kasus sikap sehari-hari.','Jika sejarah, cocokkan tokoh, peristiwa, dan tanggal (Budi Utomo 1908, Sumpah Pemuda 1928, Proklamasi 1945).','Jika kasus sikap, pilih yang bangga, positif, dan memajukan bangsa tanpa merendahkan pihak lain.','Coret opsi ekstrem: anti-asing berlebihan atau sikap apatis.'],k:'Pilih sikap bangga, positif, dan nyata memajukan bangsa.'},
'Pilar NKRI':{s:['Tentukan konsep yang ditanyakan: Pancasila, UUD 1945, NKRI, Bhinneka Tunggal Ika, Wawasan Nusantara, atau otonomi daerah.','Jika soal fakta, cocokkan dengan hafalan (Sutasoma, Deklarasi Djuanda 1957, UNCLOS 1982, ZEE 200 mil).','Jika kasus ancaman (hoaks, separatisme, intoleransi), pilih tindakan menjaga keutuhan lewat dialog, verifikasi, dan jalur hukum.','Coret opsi main hakim sendiri, membiarkan, atau ikut menyebarkan.'],k:'Pada kasus: dialog + verifikasi + jalur hukum, bukan kekerasan atau pembiaran.'},
'Integritas':{s:['Kenali dilema: godaan (gratifikasi, kecurangan, tekanan atasan) berhadapan dengan aturan.','Urutan jawaban terbaik: tolak dengan santun, bersikap jujur, lalu laporkan lewat jalur resmi.','Coret opsi yang menerima, ikut diam, atau membalas dengan cara tidak prosedural.','Jika beberapa opsi baik, pilih yang tegas sekaligus santun dan sesuai aturan.'],k:'Jujur, tolak, lapor lewat jalur resmi: tegas tetapi santun.'},
'Bela Negara':{s:['Tentukan bentuk bela negara yang ditanyakan: fisik atau nonfisik.','Pilih kontribusi nyata sesuai kemampuan dan profesi (disiplin kerja, bantu bencana, jaga keamanan siber).','Cocokkan dengan dasar hukum bila ditanya: Pasal 27(3), Pasal 30, UU 3/2002.','Coret opsi yang pasif, hanya mengkritik, atau bertindak tanpa koordinasi.'],k:'Pilih kontribusi nyata, sesuai kemampuan, dan terkoordinasi.'},
'Gagasan Utama':{s:['Baca seluruh paragraf, tandai kalimat pertama dan terakhir.','Tentukan pola: deduktif (ide di awal), induktif (di akhir), atau campuran.','Pilih kalimat atau pernyataan yang bisa merangkum semua kalimat lain.','Coret opsi yang hanya rincian atau contoh, atau yang terlalu luas melampaui isi paragraf.'],k:'Gagasan utama = yang merangkum SEMUA kalimat, bukan satu rincian.'},
'Kalimat Efektif':{s:['Cari subjek dan predikat; kalimat yang diawali kata depan biasanya tidak bersubjek.','Cek pemborosan kata: para + jamak, naik ke atas, agar supaya, sekitar ... kurang lebih.','Cek kesejajaran bentuk kata pada rincian (menyusun, memeriksa, menyimpan).','Cek kata baku: praktik, apotek, risiko, izin, nasihat.'],k:'Periksa 4 hal berurutan: subjek, mubazir, paralel, baku.'},
'Perkalian Setara':{s:['Tulis ulang kedua sisi persamaan sebagai perkalian.','Faktorkan angka ke faktor prima, atau bagi kedua sisi dengan faktor yang sama agar sederhana.','Hitung nilai yang ditanyakan, lalu uji ke persamaan awal.'],k:'Sederhanakan dengan membagi faktor yang sama sebelum menghitung.'},
'Perbandingan Kuantitatif':{s:['Hitung nilai kedua besaran (A dan B) secara terpisah.','Samakan bentuk (pecahan, desimal, persen) sebelum membandingkan.','Jika ada variabel, coba beberapa nilai (positif, nol, negatif, pecahan). Jika hasilnya berubah-ubah, jawabannya tidak dapat ditentukan.'],k:'Hitung A - B; tanda hasilnya langsung menjawab (positif, nol, atau negatif).'},
'Deret Angka Bentuk Tabel':{s:['Baca tabel baris demi baris atau kolom demi kolom sebagai satu deret.','Hitung selisih antarangka; jika tidak tetap, cek selisih tingkat dua, rasio, kuadrat atau kubik.','Cek pola selang-seling.','Isi bagian kosong, lalu pastikan pola konsisten di semua baris.'],k:'Urutan cek: selisih, rasio, selisih bertingkat, kuadrat/kubik, selang-seling.'},
'Nilai Suku ke-n dari Tabel':{s:['Tulis pasangan n dan nilai suku dari tabel.','Cari beda: a = selisih nilai ÷ selisih n (rumus linear U = a x n + b).','Cari b dari satu data: b = U - a x n.','Jika selisih nilai ikut naik tetap, polanya kuadrat (U = an² + bn + c); substitusi tiga data.','Masukkan n yang ditanyakan.'],k:'a = selisih nilai ÷ selisih n; b = nilai - a x n.'},
'Pola Operasi Baris Tabel':{s:['Ambil baris pertama yang lengkap, uji kombinasi operasi antarkolom (+, -, x, ÷, kuadrat).','Setelah ada dugaan, buktikan di baris kedua dan ketiga.','Terapkan aturan yang terbukti ke baris yang kosong.'],k:'Jangan pakai dugaan sebelum lolos uji di minimal 2 baris.'},
'Kecukupan Data':{s:['Tulis apa yang ditanyakan dan data apa yang dibutuhkan untuk menjawabnya.','Periksa pernyataan (1) saja: apakah cukup untuk satu jawaban pasti?','Periksa pernyataan (2) saja, lalu keduanya digabung.','Cocokkan hasilnya dengan pilihan A-E yang tersedia di soal.'],k:'Tidak perlu menghitung sampai tuntas; cukup tentukan apakah jawabannya bisa PASTI (satu nilai).'},
'Optimasi Paling Hemat':{s:['Daftarkan semua pilihan paket, harga, atau kombinasi.','Hitung harga per satuan (per kg, per buah, per menit) atau total biaya tiap kombinasi.','Perhatikan syarat: minimal pembelian, diskon, dan sisa barang.','Bandingkan, lalu pilih biaya terendah yang memenuhi kebutuhan.'],k:'Bandingkan harga per satuan, lalu cek syarat dan sisa barang.'},
'Analisis Data Tabel':{s:['Baca judul tabel, satuan, dan hal yang ditanyakan.','Ambil hanya sel yang relevan.','Hitung: selisih, persen = bagian ÷ total x 100, atau rata-rata.','Gunakan pembulatan dan eliminasi opsi yang jauh.'],k:'Garis bawahi satuan dan yang ditanyakan; hitung hanya sel yang perlu.'},
'Silogisme':{s:['Ubah kalimat menjadi simbol (Semua A adalah B, dst.).','Gambar diagram Venn.','Tarik kesimpulan yang PASTI benar pada semua kemungkinan gambar.','Ingat: kontraposisi (p maka q = bukan q maka bukan p) setara; invers dan konvers tidak. "Tidak semua A adalah B" berarti ada A yang bukan B.'],k:'Gambar diagram Venn dan coret opsi yang belum pasti benar.'},
'Penalaran Analitis':{s:['Catat semua pihak dan aturan yang diberikan.','Buat tabel atau diagram posisi/jadwal.','Isi dulu dari informasi yang paling pasti, lalu gabungkan syarat lainnya.','Uji setiap opsi pada tabel; coret yang melanggar syarat.'],k:'Mulai dari syarat paling pasti, isi tabel, lalu uji opsi satu per satu.'},
'Analogi Kata dan Kalimat':{s:['Tentukan hubungan pasangan kata pertama dengan kalimat "A adalah ... dari B" (sebab-akibat, bagian-keseluruhan, fungsi, jenis, alat-hasil, tingkatan).','Uji kalimat hubungan itu pada setiap pilihan.','Jika lebih dari satu cocok, pilih yang hubungannya paling spesifik dan urutannya sama.'],k:'Buat kalimat hubungan, lalu uji ke semua opsi.'},
'Figural':{s:['Amati satu elemen per langkah, jangan seluruh gambar sekaligus.','Tentukan aturan perubahannya: rotasi (45° atau 90°), pencerminan, penambahan/pengurangan elemen, warna, atau posisi.','Terapkan aturan ke langkah berikutnya.','Coret opsi yang tidak konsisten dengan aturan.'],k:'Fokus satu komponen, temukan aturannya, coret opsi yang menyimpang.'},
'Pelayanan Publik':{s:['Dengarkan dulu dan tenangkan suasana; jangan terpancing emosi.','Tunjukkan empati lalu cari solusi nyata sesuai SOP.','Jika di luar kewenangan, arahkan dengan jelas ke pihak yang berwenang, jangan menolak mentah-mentah.','Skor tinggi: tenang + empati + solusi tuntas sesuai prosedur. Skor rendah: abai, marah, atau membeda-bedakan.'],k:'Skor 5 umumnya: tenang + empati + solusi tuntas sesuai prosedur.'},
'Profesionalisme':{s:['Cari opsi yang menunjukkan tanggung jawab dan inisiatif.','Jika tugas di luar bidang, pilih belajar dan minta arahan.','Pilih yang sesuai aturan dan akuntabel; tolak gratifikasi dan penyalahgunaan wewenang.','Skor rendah: menghindar, melempar tanggung jawab, atau menunda.'],k:'Kata kunci skor 5: bertanggung jawab, inisiatif, belajar, sesuai aturan.'},
'Jejaring Kerja':{s:['Cari opsi yang membangun kolaborasi dan komunikasi terbuka.','Pilih yang aktif membantu atau berkoordinasi dengan rekan lintas unit.','Selesaikan konflik lewat dialog, bukan menegur di depan umum atau menghindar.','Skor rendah: bekerja sendiri-sendiri atau membiarkan masalah.'],k:'Pilih tindakan yang membangun hubungan dan mengajak diskusi.'},
'Teknologi Informasi dan Komunikasi':{s:['Cari opsi yang proaktif belajar teknologi baru (pelatihan, latihan mandiri, bertanya).','Pilih yang memanfaatkan teknologi untuk efisiensi kerja dan pelayanan.','Utamakan keamanan data dan kerahasiaan informasi instansi.','Skor rendah: menolak teknologi, menunggu diajari, atau ceroboh dengan data.'],k:'Pilih proaktif belajar dan memanfaatkan teknologi dengan aman.'},
'Sosial Budaya':{s:['Cari opsi yang menghormati perbedaan suku, agama, dan budaya.','Pilih sikap adaptif dan mau belajar kebiasaan setempat.','Selesaikan perbedaan lewat dialog dan sikap saling menghargai.','Skor rendah: merendahkan, memaksakan kebiasaan sendiri, atau menarik diri.'],k:'Hormati perbedaan, adaptif, dan ajak berdialog.'},
'Anti Radikalisme':{s:['Cari opsi yang menolak tegas paham dan ajakan kekerasan atau intoleransi.','Pegang Pancasila dan NKRI; utamakan dialog dan edukasi.','Laporkan potensi ancaman kepada pihak berwenang; jangan main hakim sendiri.','Skor rendah: ikut-ikutan, membiarkan, atau membalas dengan kekerasan.'],k:'Tegas menolak kekerasan, tetap persuasif, dan sesuai hukum.'}};
const GC={
TWK:{s:['Baca soal dan tentukan tema serta kata kuncinya.','Cocokkan dengan konsep atau pasal yang relevan.','Pada kasus sikap, pilih opsi yang inklusif, taat aturan, dan solutif.','Coret opsi yang ekstrem, diskriminatif, atau pasif.'],k:'Cocokkan kata kunci dengan konsep, lalu pilih sikap yang inklusif dan sesuai aturan.'},
TIU:{s:['Kenali jenis soal (verbal, numerik, atau figural).','Tulis informasi penting dan yang ditanyakan.','Selesaikan dengan metode paling singkat (eliminasi, perkiraan, pola).','Uji jawaban ke soal sebelum memilih.'],k:'Kenali jenis soal dulu, lalu pakai metode tercepat dan eliminasi opsi yang jauh.'},
TKP:{s:['Tentukan masalah utama dan pihak yang terlibat.','Pilih tindakan yang solutif, sesuai aturan, dan kolaboratif.','Skor 5: tindakan proaktif + prosedural; skor 1-2: abai, marah, atau melanggar aturan.','Bandingkan opsi lalu urutkan dari yang paling solutif.'],k:'Skor 5 umumnya: solutif + sesuai aturan + kolaboratif.'}};
const gd=q=>GD[q.tm]||GC[q.c]||GC.TWK;
function gdHTML(q,v){const g=gd(q);return (v.p?`<p><b>📖 Pembahasan soal ini:</b><br>${e(nm(v.p))}</p>`:'')+`<div class="gd"><b>🧭 Cara menjawab${q.tm?' · '+e(q.tm):''}:</b><ol>${g.s.map(x=>`<li>${e(x)}</li>`).join('')}</ol></div><div class="trik">⚡ <b>Trik cepat:</b> ${e(nm(v.tr||g.k))}${v.tr&&g.k&&v.tr!=g.k?`<br><span class="mu">Trik umum tema: ${e(g.k)}</span>`:''}</div>`}
document.head.insertAdjacentHTML('beforeend','<style>.gd{background:rgba(37,99,235,.10);border-left:4px solid var(--bl);padding:8px 12px;border-radius:6px;margin-top:8px}.gd ol{margin:6px 0 0;padding-left:20px}.grid.g10{grid-template-columns:repeat(10,1fr)}.grid.g10 button{height:34px;font-size:13px;padding:0}.grid .gok{background:#16a34a;color:#fff;border-color:#16a34a}.grid .gbad{background:#dc2626;color:#fff;border-color:#dc2626}.grid .gpart{background:#f59e0b;color:#111;border-color:#f59e0b}</style>');

/* ===== HASIL UJIAN + PEMBAHASAN (tersimpan di server, bisa dibuka lagi kapan saja) ===== */
let RF='all',LAST=null;
const qst=(q,a,v)=>a==null?'z':q.c=='TKP'?((v.w||[])[a]==5?'ok':(v.w||[])[a]>=3?'part':'bad'):(a==v.k?'ok':'bad');
function sumHTML(r){const rev=r.rev||[],S=r.qs.map((q,i)=>qst(q,r.a[i],rev.find(x=>x.id==q.id)||{})),cnt=k=>S.filter(x=>x==k).length,
 lk=n=>`<b class="no" style="cursor:pointer;display:inline-block;min-width:26px" onclick="jumpQ(${n})">${n}</b>`,
 ls=(lbl,f)=>{const a=r.qs.map((q,i)=>f(q,S[i])?i+1:0).filter(Boolean);return a.length?`<p style="margin:6px 0"><b>${lbl} (${a.length}):</b> ${a.map(lk).join(' · ')}</p>`:''};
return `<p style="margin:4px 0">✅ ${cnt('ok')} benar/optimal · ❌ ${cnt('bad')} salah · 🟧 ${cnt('part')} TKP bobot 3-4 · ⬜ ${cnt('z')} kosong</p><div class="grid g10" style="margin:10px 0">${S.map((s,i)=>`<button class="${s=='ok'?'gok':s=='bad'?'gbad':s=='part'?'gpart':''}" onclick="jumpQ(${i+1})">${i+1}</button>`).join('')}</div><p class="mu">🟩 Benar (TKP bobot 5) · 🟧 TKP bobot 3-4 · 🟥 Salah (TKP bobot 1-2) · ⬜ Kosong. Ketuk nomor untuk melihat pembahasannya.</p>${ls('Salah TWK',(q,s)=>q.c=='TWK'&&s=='bad')}${ls('Salah TIU',(q,s)=>q.c=='TIU'&&s=='bad')}${ls('TKP belum optimal (bobot di bawah 5)',(q,s)=>q.c=='TKP'&&(s=='bad'||s=='part'))}${ls('Kosong',(q,s)=>s=='z')}`}
function openRes(r){R={h:r.h,qs:r.qs,a:r.a,rev:r.rev};RF='all';V='result';route()}
async function openHist(id){const r=await api('review?id='+id);if(!r.ok)return alert(r.error||'Gagal memuat pembahasan.');openRes(r)}
const setRF=f=>{RF=f;result();const b=$('rf');if(b)b.scrollIntoView()};
function jumpQ(n){if(V!='result'){if(!LAST)return;openRes(LAST)}else if(!$('rq'+n)){RF='all';result()}setTimeout(()=>{const el=$('rq'+n);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},120)}
function result(){const h=R.h,rev=R.rev||[],S=R.qs.map((q,i)=>qst(q,R.a[i],rev.find(x=>x.id==q.id)||{})),
 show=(q,s)=>RF=='all'||(RF=='salah'?(s=='bad'||s=='part'):RF=='kosong'?s=='z':q.c==RF),
 fb=[['all','Semua'],['salah','Salah'],['kosong','Kosong'],['TWK','TWK'],['TIU','TIU'],['TKP','TKP']],
 cards=R.qs.map((q,i)=>{if(!show(q,S[i]))return '';const a=R.a[i],v=rev.find(x=>x.id==q.id)||{},s=S[i],t=q.c=='TKP',
  col=s=='ok'?'#16a34a':s=='bad'?'#dc2626':s=='part'?'#f59e0b':'#9ca3af',
  lbl=s=='ok'?'✓ BENAR':s=='bad'?'✗ SALAH':s=='part'?'◐ BOBOT '+v.w[a]+'/5':'○ KOSONG',
  best=k=>t?(v.w||[])[k]==5:k==v.k;
  return `<div class="card rc" id="rq${i+1}" style="border-left:6px solid ${col}"><div class="rn" style="color:${col}"><span style="background:${col}">${i+1}</span><small>${lbl}</small></div><div class="rb"><span class="tag">${q.c}${q.tm?' · '+e(q.tm):''}</span><p>${rq(q.t)}</p>${q.o.map((o,k)=>{let st='';if(best(k))st='border-color:#16a34a;background:rgba(22,163,74,.15)';else if(k===a)st=s=='part'?'border-color:#f59e0b;background:rgba(245,158,11,.18)':'border-color:#dc2626;background:rgba(220,38,38,.15)';return `<div class="opt" style="cursor:default;${st}"><b>${'ABCDE'[k]}.</b> ${ro(o)}${t&&v.w?` <span class="mu">(bobot ${v.w[k]})</span>`:''}${k===a?' <span class="mu">← jawabanmu</span>':''}</div>`}).join('')}<p>Jawabanmu: <b style="color:${col}">${a==null?'kosong':'ABCDE'[a]+(t&&v.w?' (bobot '+v.w[a]+')':'')}</b> · ${t?(v.w?'kunci terbaik: '+'ABCDE'[v.w.indexOf(Math.max(...v.w))]:''):'kunci: '+'ABCDE'[v.k]}</p>${gdHTML(q,v)}</div></div>`}).join('');
shell(`<div class="card"><h2>Hasil Ujian</h2>${h.d?`<p class="mu">${e(h.d)}${h.dur?' · durasi '+e(h.dur):''}</p>`:''}<div class="row"><div class="stat">TWK<b>${h.tw}</b><span class="mu">min ${PG.TWK}</span></div><div class="stat">TIU<b>${h.ti}</b><span class="mu">min ${PG.TIU}</span></div><div class="stat">TKP<b>${h.tk}</b><span class="mu">min ${PG.TKP}</span></div><div class="stat">Total<b>${h.tot}</b><span class="${h.ok?'ok':'no'}">${h.ok?'LULUS passing grade':'Belum lulus passing grade'}</span></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="go('dash')">Dashboard</button><button class="btn ok" onclick="startExam()">Ulangi Ujian</button></div></div>
<div class="card"><h3>Penanda Soal</h3>${sumHTML(R)}</div>
<h3 id="rf">Pembahasan</h3><div class="tabs" style="flex-wrap:wrap">${fb.map(([k,l])=>`<button class="${RF==k?'on':''}" onclick="setRF('${k}')">${l}</button>`).join('')}</div>${cards||'<p class="mu">Tidak ada soal pada filter ini.</p>'}`)}

/* ===== MENU UJIAN: tampilkan hasil ujian sebelumnya + pembahasannya ===== */
function brief(){shell(`<div id="lastx"></div><div class="card"><h2>Petunjuk Ujian CAT SKD</h2><ul><li>Waktu <b>100 menit</b> untuk seluruh bagian. Timer mulai berjalan saat tombol Start ditekan.</li><li>Ada tiga bagian: <b>TWK</b>, <b>TIU</b>, <b>TKP</b>. Kamu bebas mulai dari bagian mana pun dengan menekan tab TWK / TIU / TKP di atas soal.</li><li>TWK dan TIU: jawaban benar +5, salah atau kosong 0. TKP: bobot 1 sampai 5 sesuai pilihan.</li><li>Nomor soal: biru = sudah dijawab, kuning = ragu-ragu, abu-abu = belum dijawab.</li><li>Passing grade: TWK 65, TIU 80, TKP 156 (semuanya harus terpenuhi).</li><li>Ujian berakhir saat waktu habis atau saat kamu menekan Selesai Ujian. Pembahasan tersedia setelahnya dan tersimpan untuk dibuka lagi.</li></ul><p class="mu">Paket ini berisi 110 soal.</p><button class="btn ok" style="width:100%" onclick="startExam()">Start Ujian</button></div>`);loadLast()}
async function loadLast(){const r=await api('review'),b=$('lastx');if(!b)return;if(!r.ok||!r.qs){b.innerHTML=r.error&&!/Belum ada/.test(r.error)?`<div class="card"><h3>Ujian Sebelumnya</h3><p class="mu">${e(r.error)}</p></div>`:'';return}
 LAST=r;const h=r.h;b.innerHTML=`<div class="card"><h3>📋 Hasil Ujian Sebelumnya</h3><p class="mu">${e(h.d)}${h.dur?' · durasi '+e(h.dur):''}</p><div class="row"><div class="stat">TWK<b class="${h.tw>=PG.TWK?'ok':'no'}">${h.tw}</b></div><div class="stat">TIU<b class="${h.ti>=PG.TIU?'ok':'no'}">${h.ti}</b></div><div class="stat">TKP<b class="${h.tk>=PG.TKP?'ok':'no'}">${h.tk}</b></div><div class="stat">Total<b>${h.tot}</b><span class="${h.ok?'ok':'no'}">${h.ok?'LULUS':'BELUM LULUS'}</span></div></div>${sumHTML(r)}<button class="btn" style="width:100%;margin-top:8px" onclick="openRes(LAST)">Lihat Pembahasan Lengkap</button></div>`}

/* ===== DASHBOARD: tombol pembahasan untuk tiap riwayat ujian ===== */
function dash(){const h=U[cur].hist,l=h[h.length-1],pr=h[h.length-2],d=l&&pr?l.tot-pr.tot:null;
shell(`<div class="card"><h2>Nilai Terbaru</h2>${l?`<div class="row"><div class="stat">TWK<b class="${l.tw>=PG.TWK?'ok':'no'}">${l.tw}</b><span class="mu">min ${PG.TWK}</span></div><div class="stat">TIU<b class="${l.ti>=PG.TIU?'ok':'no'}">${l.ti}</b><span class="mu">min ${PG.TIU}</span></div><div class="stat">TKP<b class="${l.tk>=PG.TKP?'ok':'no'}">${l.tk}</b><span class="mu">min ${PG.TKP}</span></div><div class="stat">Total<b>${l.tot}</b><span class="${l.ok?'ok':'no'}">${l.ok?'LULUS':'BELUM LULUS'}</span></div></div>${d!==null?`<p>${d>0?'📈 Naik':d<0?'📉 Turun':'➖ Stagnan'} ${Math.abs(d)} poin dari tryout sebelumnya.</p>`:''}`:'<p class="mu">Belum ada tryout. Mulai sekarang!</p>'}</div>
<div class="card"><h3>Grafik Riwayat Total Nilai</h3>${chart(h)}</div>
<div class="card"><h3>Tryout CAT (110 soal · 100 menit)</h3><p class="mu">Skor diproyeksikan ke skala penuh SKD (TWK 150, TIU 175, TKP 225) bila paket kurang dari 110 soal.</p><button class="btn ok" onclick="go('brief')">Klik untuk Ujian</button> <button class="btn" onclick="go('latihan')">Latihan Soal</button> ${l&&l.id?`<button class="btn y" onclick="openHist(${l.id})">Pembahasan Ujian Terakhir</button>`:''}</div>
<div class="card sc"><h3>Riwayat</h3><table><tr><th>Tanggal</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Waktu</th><th>Status</th><th>Pembahasan</th></tr>${h.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.tw}</td><td>${x.ti}</td><td>${x.tk}</td><td>${x.tot}</td><td>${x.dur}</td><td class="${x.ok?'ok':'no'}">${x.ok?'Lulus':'Belum'}</td><td>${x.id?`<button class="btn" onclick="openHist(${x.id})">Lihat</button>`:'-'}</td></tr>`).join('')}</table></div>`)}

/* ===== MODE LATIHAN: setelah menjawab selalu keluar cara menjawab detail + trik cepat ===== */
function prUI(){const q=P.qs[P.i],f=P.fb[P.i],t=q.c=='TKP';shell(`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${q.c}${q.tm?' · '+e(q.tm):''}</span><b>Latihan ${P.i+1} / ${P.qs.length}</b></div><p style="font-size:17px;margin:14px 0">${rq(q.t)}</p>${q.o.map((o,k)=>{let st='';if(f){const best=t?f.w[k]==5:k==f.k;if(best)st='border-color:#16a34a;background:rgba(22,163,74,.15)';else if(k==f.a)st='border-color:#dc2626;background:rgba(220,38,38,.15)'}return `<button class="opt" style="${st}" ${f?'disabled':''} onclick="prPick(${k})"><b>${'ABCDE'[k]}.</b> ${ro(o)}${f&&t?` <span class="mu">(bobot ${f.w[k]})</span>`:''}</button>`}).join('')}${f?`<div class="card" style="margin-top:10px;background:var(--bg)"><b class="${f.good?'ok':'no'}">${t?(f.good?'Jawaban terbaik! +5':'Bobot jawabanmu: '+f.pt):(f.good?'Benar! +5':'Salah')}</b><p>${t?'Kunci terbaik: '+'ABCDE'[f.w.indexOf(5)]:'Kunci: '+'ABCDE'[f.k]}</p>${gdHTML(q,f)}</div>`:''}<div class="bar"><button class="btn g" onclick="P=null;latihan()">Keluar</button>${f?(P.i<P.qs.length-1?'<button class="btn" onclick="P.i++;prUI()">Selanjutnya</button>':'<button class="btn ok" onclick="prEnd()">Selesai</button>'):''}</div></div>`)}
/* ===== Ganti nama "Citra" -> "Luluk" di semua soal, opsi, pembahasan ===== */
function nm(s){return String(s==null?'':s).replace(/CITRA/g,'LULUK').replace(/Citra/g,'Luluk').replace(/citra/g,'luluk')}

/* ===== Layout kartu pembahasan: nomor & status di kiri ===== */
document.head.insertAdjacentHTML('beforeend','<style>.rc{display:flex;gap:10px;align-items:flex-start}.rn{flex:0 0 58px;text-align:center;position:sticky;top:8px}.rn span{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;margin:0 auto 4px}.rn small{display:block;font-weight:700;font-size:11px;line-height:1.2}.rb{flex:1;min-width:0}.bar{flex-wrap:wrap}.bar .btn{flex:1;padding:8px 6px;font-size:14px;white-space:nowrap}</style>');

/* ===== Ujian: tombol Selesai & Kirim + konfirmasi ===== */
function examUI(){const q=ex.qs[ex.i],last=ex.i==ex.qs.length-1,all=ex.a.every(x=>x!==null);shell(`<div class="ex"><div class="card q"><div class="tabs">${['TWK','TIU','TKP'].map(c=>`<button class="${q.c==c?'on':''}" onclick="ex.i=Math.max(0,ex.qs.findIndex(x=>x.c=='${c}'));examUI()">${c}</button>`).join('')}</div><div class="row" style="justify-content:space-between"><span class="tag">${q.c}${q.tm?" · "+e(q.tm):""}</span><b>Soal ${ex.i+1} dari ${ex.qs.length}</b></div><p style="font-size:17px;margin:14px 0">${rq(q.t)}</p>${q.o.map((o,k)=>`<button class="opt ${ex.a[ex.i]===k?'s':''}" onclick="pick(${k})"><b>${'ABCDE'[k]}.</b> ${ro(o)}</button>`).join('')}<div class="bar"><button class="btn g" onclick="mv(-1)">Sebelumnya</button><button class="btn y" onclick="doubt()">Ragu-Ragu</button>${last?'<button class="btn ok" onclick="askFinish()">Selesai &amp; Kirim</button>':'<button class="btn" onclick="mv(1)">Selanjutnya</button>'}</div>${all&&!last?'<button class="btn ok" style="width:100%;margin-top:10px" onclick="askFinish()">✅ Semua terjawab: Selesai &amp; Kirim Jawaban</button>':''}</div>
<div class="card nv"><div>Sisa waktu <span class="tm" id="tm">${fmt(ex.left)}</span></div><div class="grid" style="margin:12px 0">${ex.qs.map((_,i)=>`<button class="${ex.s[i]==2?'d':ex.s[i]==1?'a':''} ${i==ex.i?'cur':''}" onclick="ex.i=${i};examUI()">${i+1}</button>`).join('')}</div><p class="mu">🟦 Dijawab · 🟨 Ragu-ragu · ⬜ Belum</p><button class="btn ${all?'ok':'r'}" style="width:100%" onclick="askFinish()">${all?'Selesai &amp; Kirim Jawaban':'Selesai Ujian'}</button></div></div>`)}
function askFinish(){closeFin();const un=ex.a.filter(x=>x===null).length,dt=ex.s.filter(x=>x==2).length,m=document.createElement('div');m.id='fm';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99';
m.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><h3>Yakin kirim jawaban?</h3><p>${un?`⚠️ Masih <b class="no">${un}</b> soal belum dijawab. `:'✅ Semua soal sudah dijawab. '}${dt?`Ada <b>${dt}</b> soal ragu-ragu. `:''}Setelah dikirim, jawaban tidak bisa diubah.</p><div class="row"><button class="btn g" onclick="closeFin()">Kembali, ganti jawaban</button><button class="btn ok" onclick="finish()">Ya, kirim jawaban</button></div></div>`;document.body.appendChild(m)}
function closeFin(){const m=$('fm');if(m)m.remove()}
addEventListener('hashchange',route);route();
</script></body></html>
